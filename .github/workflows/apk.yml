# Compile l'APK Android TV et le publie comme « Release » GitHub.
# Lien fixe vers la dernière version :
#   https://github.com/<compte>/Novastream/releases/latest/download/NovaStream-TV.apk
name: Construire l'APK

on:
  push:
    branches: [main]
    paths-ignore: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accepter les licences du SDK Android (déjà installé sur le runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compiler
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk NovaStream-TV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NovaStream-TV
          path: NovaStream-TV.apk

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NovaStream TV 1.0.${{ github.run_number }}
          body: "APK Android TV / Google TV / Fire TV. Installation : voir le README."
          files: NovaStream-TV.apk
          make_latest: true
