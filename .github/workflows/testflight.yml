# Signe l'appli iPhone avec le compte développeur et l'envoie sur TestFlight.
# Secrets GitHub nécessaires (Settings › Secrets and variables › Actions) :
#   APPLE_TEAM_ID   identifiant d'équipe (10 caractères, developer.apple.com › Membership)
#   ASC_KEY_ID      identifiant de la clé API App Store Connect
#   ASC_ISSUER_ID   « Issuer ID » affiché au-dessus de la liste des clés
#   ASC_KEY_P8      contenu complet du fichier AuthKey_XXXX.p8
name: Envoyer sur TestFlight

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les secrets
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -z "$TEAM" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$KEY" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ISSUER" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$P8" ] && missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Secrets manquants :$missing"; exit 1; fi

      - name: Installer la clé API
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: printf '%s' "$P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Archiver (signature automatique)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project NovaStream.xcodeproj \
            -scheme NovaStream \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NovaStream.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          test -d "$RUNNER_TEMP/NovaStream.xcarchive"

      - name: Envoyer sur App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/NovaStream.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Afficher les erreurs
        if: failure()
        run: grep -E "error:" archive.log | head -50 || true
